# Wind-farm inspection configuration.
# Single source of truth for the gz world layout (gz/worlds/wind_farm.sdf)
# and the ROS2 simulator (scripts/wind_farm_simulator.py, scripts/cycle_planner.py).
#
# Coordinate conventions:
#   - turbine positions are ENU metres in the gz world frame (tower base),
#     matching the <include> poses in gz/worlds/wind_farm.sdf
#     (farm.xacro grid formula with x0=0, y0=0, scale=200, nx=ny=2).
#   - the planner converts them to the PX4 local NED frame (north=+x, east=+y,
#     down=-z) with the home position (PX4_GZ_MODEL_POSE) as origin.
world: wind_farm

# PX4_GZ_MODEL_POSE used to spawn the drone (ENU metres in the gz world).
# Home position for the PX4 local NED frame; must match the bringup launch.
drone_home:
  x: -80.0
  y: -25.0
  z: 0.5

gps_origin:
  latitude: 47.397971057728974   # matches <spherical_coordinates> in the world
  longitude: 8.546163739800146
  elevation: 0.0

# Global defaults inherited by every turbine unless overridden per-turbine.
turbine_defaults:
  velocity: -0.0        # rad/s; 0 = blades locked, <0 = spinning
  nacelle_yaw: 0.0      # rad, preset yaw angle of the nacelle
  blade_pitch: 0.0      # rad, preset pitch angle of the blades
  hub_position: 0.0     # rad, preset rotor hub position (when velocity == 0)

turbines:
  - name: wind_turbine_1_1
    velocity: -2.0
    x: 0.0
    y: 0.0
  - name: wind_turbine_2_1
    x: 150.0
    y: 0.0
  - name: wind_turbine_1_2
    x: 50.0
    y: 150.0
  - name: wind_turbine_2_2
    x: 200.0
    y: 150.0

inspection:
  # Orbit the first turbine (wind_turbine_1_1 at the farm origin).
  # Rotor radius is ~63 m (blades reach x in [-56, +56], rotor plane at y~7),
  # so 85 m clears the whole turbine with margin.
  orbit_radius: 85.0
  orbit_altitude: 95.0        # m above ground, near hub height (~90 m)
  num_waypoints: 12
  waypoint_tolerance: 3.0     # m, horizontal acceptance radius
  waypoint_timeout: 60.0      # s, max time per waypoint
  yaw_towards_turbine: true
